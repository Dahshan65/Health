function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

/* ================= body calculations ================= */
function calc(d){
 const H=d.height/100,r={};const cond=d.cond||'none';
 r.bmi=d.weight/(H*H);
 r.bmiCat=r.bmi<18.5?'under':r.bmi<25?'normal':r.bmi<30?'over':r.bmi<35?'ob1':'ob2';
 r.whtr=d.waist?d.waist/d.height:null;
 r.whr=(d.waist&&d.hip)?d.waist/d.hip:null;
 r.cw=(d.chest&&d.waist)?d.chest/d.waist:null;
 r.cwCat=null;if(r.cw!==null&&d.sex==='m')r.cwCat=r.cw>=1.3?'good':r.cw>=1.15?'mid':'low';
 r.wc=null;if(d.waist){r.wc=d.sex==='m'?(d.waist<94?'good':d.waist<102?'warn':'bad'):(d.waist<80?'good':d.waist<88?'warn':'bad')}
 r.armSt=null;if(d.arm){r.armSt=d.arm<(d.sex==='m'?23:22)?'warn':'good'}
 r.thighSt=null;if(d.thigh){r.thighSt=d.thigh<(d.sex==='m'?48:46)?'warn':'good'}
 r.bf=null;
 if(d.neck&&d.waist){
  if(d.sex==='m'&&d.waist>d.neck)r.bf=495/(1.0324-0.19077*Math.log10(d.waist-d.neck)+0.15456*Math.log10(d.height))-450;
  else if(d.sex==='f'&&d.hip&&(d.waist+d.hip)>d.neck)r.bf=495/(1.29579-0.35004*Math.log10(d.waist+d.hip-d.neck)+0.22100*Math.log10(d.height))-450;
 }
 if(r.bf!==null&&(!isFinite(r.bf)||r.bf<2||r.bf>60))r.bf=null;
 if(cond==='preg')r.bf=null;
 if(r.bf!==null){const m=d.sex==='m';r.bfCat=m?(r.bf<6?'low':r.bf<=24?'healthy':r.bf<=30?'high':'veryhigh'):(r.bf<14?'low':r.bf<=31?'healthy':r.bf<=37?'high':'veryhigh');r.lean=d.weight*(1-r.bf/100)}
 r.bmr=10*d.weight+6.25*d.height-5*d.age+(d.sex==='m'?5:-161);
 r.tdee=r.bmr*d.act;
 r.idealMin=18.5*H*H;r.idealMax=24.9*H*H;
 r.water=d.weight*0.033+(d.act>=1.9?0.7:d.act>=1.725?0.5:d.act>=1.55?0.35:d.act>=1.375?0.15:0)+(cond==='preg'?0.5:0);
 r.cups=Math.max(4,Math.round(r.water/0.25));
 r.tw=null;r.twLow=false;
 if(d.tw&&d.tw>=30&&d.tw<=300){const df=d.tw-d.weight,ab=Math.abs(df);let a=null,b=null;if(ab>=0.5){const lo=0.25,hi=df<0?0.75:0.5;a=Math.max(1,Math.round(ab/hi));b=Math.max(a,Math.round(ab/lo))}r.tw={df:df,a:a,b:b};r.twLow=d.tw/(H*H)<18.5}
 r.bmiSt=r.bmiCat==='normal'?'good':(r.bmiCat==='ob1'||r.bmiCat==='ob2')?'bad':'warn';
 if(r.whtr!==null){r.whtrCat=r.whtr<0.5?'good':r.whtr<0.6?'warn':'bad'}
 if(r.whr!==null){const m=d.sex==='m';r.whrCat=m?(r.whr<0.9?'good':r.whr<1?'warn':'bad'):(r.whr<0.85?'good':r.whr<0.9?'warn':'bad')}
 if(r.bf!==null){r.bfSt=r.bfCat==='healthy'?'good':r.bfCat==='veryhigh'?'bad':'warn'}
 r.parts=[];
 let bs={good:100,warn:70,bad:35}[r.bmiSt];if(r.bmi>=35||r.bmi<17)bs=30;
 r.parts.push(['m_bmi',bs]);
 if(r.whtrCat)r.parts.push(['m_whtr',{good:100,warn:65,bad:30}[r.whtrCat]]);
 if(r.whrCat)r.parts.push(['m_whr',{good:100,warn:65,bad:35}[r.whrCat]]);
 if(r.bfSt)r.parts.push(['m_bf',{good:100,warn:65,bad:30}[r.bfSt]]);
 r.score=Math.round(r.parts.reduce((a,b)=>a+b[1],0)/r.parts.length);
 r.doctor=(r.bmi>=35||r.bmi<17||d.age>=60||r.bfCat==='veryhigh'||(r.whtr!==null&&r.whtr>=0.6)||cond!=='none');
 r.skinny=(r.bf!==null&&r.bmiCat==='normal'&&(r.bfCat==='high'||r.bfCat==='veryhigh'));
 r.lowMuscle=(r.armSt==='warn'||r.thighSt==='warn');
 let goal=d.goal;r.goalNote=false;r.healthNote=false;
 if(r.bmi<18.5&&goal==='lose'){goal='gain';r.goalNote=true}
 if(cond==='preg')goal='maintain';
 r.goal=goal;
 {let lo={lose:8000,health:7000,maintain:7000,gain:6000}[goal],hi={lose:10000,health:9000,maintain:8000,gain:8000}[goal];if(d.age>=60||r.bmi>=30||cond==='preg'){lo=5000;hi=7000}r.steps=[lo,hi]}
 let k=goal==='lose'?r.tdee-500:goal==='gain'?r.tdee+300:r.tdee;
 if(goal==='health'){r.healthNote=true;k=r.bmi<18.5?r.tdee+250:r.bmi>=25?r.tdee-300:r.tdee}
 if(cond==='preg')k=r.tdee+300;
 k=Math.max(k,d.sex==='f'?1200:1500);
 r.kcal=Math.round(k/10)*10;
 r.rate=cond==='preg'?0:(r.kcal-r.tdee)*7/7700;
 const pk={lose:1.6,gain:1.8,maintain:1.2,health:1.3}[goal];
 r.protein=Math.round(Math.min(d.weight,r.idealMax*1.1,120)*pk);
 r.fat=Math.round(r.kcal*0.27/9);
 r.carbs=Math.max(0,Math.round((r.kcal-r.protein*4-r.fat*9)/4));
 return r;
}
function run(){

 if(d.weight<30||d.weight>300){showErr(t('e_range'),'weight');return}
 if(d.age>100){showErr(t('e_range'),'age');return}
 for(const f in RANGES){const v=d[f];if(v!=null&&(v<RANGES[f][0]||v>RANGES[f][1])){showErr(t('e_meas').replace('{f}',t(f)).replace('{a}',RANGES[f][0]).replace('{b}',RANGES[f][1]),f);return}}
 if(d.neck&&d.waist&&d.neck>=d.waist){showErr(t('e_neckwaist'),'neck');return}
 if(d.sex==='m'&&d.cond==='preg')d.cond='none';
 last={d:d,r:calc(d),date:new Date().toISOString()};
 render();$('reportWrap').style.display='block';

}

/* ================= history ================= */
function getHist(){const a=jget('bh_hist',[]);return Array.isArray(a)?a.filter(x=>x&&x.d&&x.date):[]}
function setHist(a){a.sort((x,y)=>x.date<y.date?1:-1);jset('bh_hist',a)}
function saveRec(){
 if(!last)return;const a=getHist();
 if(a.some(x=>x.date===last.date)){toast(t('h_dup'));return}
 a.push({date:last.date,d:last.d,bmi:r1(last.r.bmi),score:last.r.score});setHist(a);
 prof=names().length<2?'__all':(last.d.name||'');store.set('bh_prof',prof);
 renderHistory();renderDaily();toast(t('h_saved'));
}
function names(){const s=[];getHist().forEach(x=>{const n=x.d.name||'';if(s.indexOf(n)<0)s.push(n)});return s}
function filtered(){const a=getHist();return prof==='__all'?a:a.filter(x=>(x.d.name||'')===prof)}
function setProf(v){prof=v;store.set('bh_prof',v);renderHistory()}
function setChart(v){chartKey=v;store.set('bh_chart',v);renderHistory()}
function chartVal(x,k){if(k==='weight')return x.d.weight;if(k==='waist')return x.d.waist||null;if(k==='bmi')return x.bmi;return x.score}
function lineChart(pts,color){
 const mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),W=300,Hh=120,pd=16,rg=(mx-mn)||1;
 const xy=pts.map((v,i)=>[r1(pd+i*(W-2*pd)/Math.max(1,pts.length-1)),r1(Hh-pd-(v-mn)/rg*(Hh-2*pd-8))]);
 return '<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;max-width:460px;direction:ltr;background:var(--chart);border-radius:12px;margin-bottom:10px"><polyline fill="none" stroke="'+(color||'#0a74c4')+'" stroke-width="2.5" points="'+xy.map(p=>p.join(',')).join(' ')+'"/>'
  +xy.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+(color||'#0a74c4')+'"/><text x="'+p[0]+'" y="'+(p[1]-7)+'" font-size="9" text-anchor="middle" style="fill:var(--ink)">'+pts[i]+'</text>').join('')+'</svg>';
}
function renderHistory(){
 const all=getHist(),box=$('history');
 $('names').innerHTML=names().filter(n=>n).map(n=>'<option value="'+esc(n)+'">').join('');
 if(!all.length){box.innerHTML='<p class="hint">'+t('h_empty')+'</p>';return}
 const ns=names();if(prof!=='__all'&&ns.indexOf(prof)<0)prof='__all';
 const a=filtered(),pro=isPro();
 let h='';
 if(ns.length>1){
  h+='<div class="tools"><label style="margin:0">'+t('prof')+'</label><select onchange="setProf(this.value)"><option value="__all"'+(prof==='__all'?' selected':'')+'>'+t('prof_all')+'</option>';
  ns.forEach(n=>{h+='<option value="'+esc(n)+'"'+(prof===n?' selected':'')+'>'+esc(n||t('prof_none'))+'</option>'});
  h+='</select></div>';
 }
 const days=Math.floor((Date.now()-new Date(a[0].date).getTime())/864e5);
 if(days>=1)h+='<p class="hint" style="margin-top:0">'+t('last_ago').replace('{n}',days)+(days>=14?' <b>'+t('remeasure')+'</b>':'')+'</p>';
 const one=prof!=='__all'||ns.length===1;
 if(one&&a.length>=2&&pro){
  const recs=a.slice(0,12).reverse().filter(x=>chartVal(x,chartKey)!=null);
  h+='<div class="tools"><b style="font-size:15px">'+t('h_chart')+'</b><select onchange="setChart(this.value)">'+['weight','waist','bmi','score'].map(k=>'<option value="'+k+'"'+(k===chartKey?' selected':'')+'>'+t('ch_'+k)+'</option>').join('')+'</select></div>';
  if(recs.length>=2)h+=lineChart(recs.map(x=>chartVal(x,chartKey)));
 }
 h+='<div style="overflow-x:auto"><table><thead><tr><th>'+t('h_date')+'</th><th>'+t('h_w')+'</th><th>BMI</th><th>'+t('h_s')+'</th><th></th></tr></thead><tbody>';
 a.forEach((x,i)=>{
  const prev=a.slice(i+1).find(y=>(y.d.name||'')===(x.d.name||''));
  let chg='';if(prev){const dw=r1(x.d.weight-prev.d.weight);chg=' <span class="tag" title="'+esc(t('h_chg'))+'">'+(dw>0?'+':'')+dw+'</span>'}
  const id=esc(x.date);
  h+='<tr><td>'+dateStr(x.date)+(x.d.name?'<br><small>'+esc(x.d.name)+'</small>':'')+'</td><td>'+x.d.weight+chg+'</td><td>'+x.bmi+'</td><td>'+x.score+'</td>'
   +'<td style="white-space:nowrap"><button class="b sec small" onclick="viewRec(\''+id+'\')">'+t('h_view')+'</button> <button class="b red small" onclick="delRec(\''+id+'\')">'+t('h_del')+'</button></td></tr>';
 });
 h+='</tbody></table></div><div class="btns"><button class="b red small" onclick="clearHist()">'+t('h_clear')+'</button></div>';
 box.innerHTML=h;
}
function viewRec(id){const x=getHist().find(y=>y.date===id);if(!x)return;fillForm(x.d);last={d:x.d,r:calc(x.d),date:x.date};showTab('home');render();$('reportWrap').style.display='block';setTimeout(()=>$('reportWrap').scrollIntoView({behavior:'smooth'}),50)}
function delRec(id){ask(t('h_delc'),()=>{setHist(getHist().filter(y=>y.date!==id));renderHistory()})}
function clearHist(){ask(t('h_conf'),()=>{setHist(prof==='__all'?[]:getHist().filter(x=>(x.d.name||'')!==prof));setProf('__all')})}
function userBody(){const h=getHist()[0];const d=(last&&last.d)||(h&&h.d)||{};return{w:d.weight||70,h:d.height||170,sex:d.sex||'m'}}

/* ================= walk & run tracker ================= */
let trk={st:'idle',type:store.get('bh_trktype','walk'),pts:[],dist:0,t0:0,paused:0,pauseAt:0,watch:null,timer:null,lock:null,last:null,acc:null,gerr:false,done:null};
const getRuns=()=>jget('bh_runs',[]);
function hav(a,b){const R=6371000,toR=Math.PI/180,dLa=(b[0]-a[0])*toR,dLo=(b[1]-a[1])*toR,x=Math.sin(dLa/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function elapsed(){if(trk.st==='idle')return 0;return Math.max(0,((trk.st==='pause'?trk.pauseAt:Date.now())-trk.t0-trk.paused)/1000)}
function fmtDur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)}
function fmtPace(sec,m){if(m<50)return '--';const p=sec/(m/1000);return Math.floor(p/60)+':'+pad(Math.round(p%60))}
function kcalOf(type,m){return Math.round(userBody().w*(m/1000)*(type==='run'?1.0:0.6))}
function stepsOf(type,m){const b=userBody();return Math.round(m/(b.h/100*(type==='run'?0.65:0.415)))}
async function keepAwake(){try{if(window.AndroidApp)AndroidApp.keepScreen(true)}catch(e){}try{if('wakeLock' in navigator&&!trk.lock){trk.lock=await navigator.wakeLock.request('screen');trk.lock.addEventListener('release',()=>{trk.lock=null})}}catch(e){}}
function release(){try{if(window.AndroidApp)AndroidApp.keepScreen(false)}catch(e){}try{if(trk.lock)trk.lock.release()}catch(e){}trk.lock=null}
function onPos(p){
 const c=p.coords;trk.acc=Math.round(c.accuracy);trk.gerr=false;
 if(trk.st==='run'&&c.accuracy<=35){
  const pt=[c.latitude,c.longitude,p.timestamp];
  if(trk.last){const dd=hav(trk.last,pt),dt=(pt[2]-trk.last[2])/1000;if(dd<4){trkUi();return}if(dt>0&&dd/dt>12){trkUi();return}trk.dist+=dd}
  trk.last=pt;trk.pts.push([Math.round(c.latitude*1e5)/1e5,Math.round(c.longitude*1e5)/1e5]);
 }
 trkUi();
}
function onPosErr(){trk.gerr=true;trkUi()}
function trkStart(){
 if(!navigator.geolocation){toast(t('tk_gps_no'));return}
 trk.st='run';trk.pts=[];trk.dist=0;trk.t0=Date.now();trk.paused=0;trk.last=null;trk.done=null;
 trk.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
 clearInterval(trk.timer);trk.timer=setInterval(trkUi,1000);keepAwake();renderTrack();
}
function trkPause(){if(trk.st==='run'){trk.st='pause';trk.pauseAt=Date.now()}else if(trk.st==='pause'){trk.paused+=Date.now()-trk.pauseAt;trk.st='run';trk.last=null;keepAwake()}renderTrack()}
function trkStop(){
 const dur=elapsed(),m=trk.dist;
 if(trk.watch!=null)navigator.geolocation.clearWatch(trk.watch);
 clearInterval(trk.timer);release();trk.st='idle';trk.watch=null;trk.dist=0;trk.acc=null;const allPts=trk.pts;trk.pts=[];
 if(m<50||dur<60){toast(t('tk_short'));renderTrack();return}
 let pts=allPts;if(pts.length>300){const s=Math.ceil(pts.length/300);pts=pts.filter((_,i)=>i%s===0||i===allPts.length-1)}
 const rec={id:Date.now(),type:trk.type,dist:Math.round(m),dur:Math.round(dur),kcal:kcalOf(trk.type,m),steps:stepsOf(trk.type,m),pts:pts};
 const a=getRuns();a.unshift(rec);jset('bh_runs',a.slice(0,500));
 trk.done=rec;toast(t('tk_saved'));renderTrack();
}
function setType(v){if(trk.st!=='idle')return;trk.type=v;store.set('bh_trktype',v);renderTrack()}
function routeSvg(pts){
 if(!pts||pts.length<2)return '';
 const la0=pts[0][0]*Math.PI/180,xs=pts.map(p=>p[1]*Math.cos(la0)),ys=pts.map(p=>-p[0]);
 const mnx=Math.min.apply(null,xs),mxx=Math.max.apply(null,xs),mny=Math.min.apply(null,ys),mxy=Math.max.apply(null,ys);
 const W=300,H=170,pd=14,sc=Math.min((W-2*pd)/((mxx-mnx)||1e-9),(H-2*pd)/((mxy-mny)||1e-9));
 const ox=(W-(mxx-mnx)*sc)/2,oy=(H-(mxy-mny)*sc)/2;
 const P=xs.map((x,i)=>[r1(ox+(x-mnx)*sc),r1(oy+(ys[i]-mny)*sc)]);
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:460px;display:block;margin:10px auto;background:var(--chart);border-radius:12px;direction:ltr"><polyline fill="none" stroke="#0a74c4" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="'+P.map(p=>p.join(',')).join(' ')+'"/><circle cx="'+P[0][0]+'" cy="'+P[0][1]+'" r="6" fill="#1e9e57"/><circle cx="'+P[P.length-1][0]+'" cy="'+P[P.length-1][1]+'" r="6" fill="#d64545"/></svg>';
}
function trkUi(){
 if(tab!=='track'||!$('tkKm'))return;
 const s=elapsed(),m=trk.dist;
 $('tkKm').textContent=(m/1000).toFixed(2);
 $('tkTime').textContent=fmtDur(s);
 $('tkPace').textContent=fmtPace(s,m);
 $('tkSpeed').textContent=s>0?r1(m/1000/(s/3600)):'0';
 $('tkKcal').textContent=kcalOf(trk.type,m);
 $('tkSteps').textContent=stepsOf(trk.type,m);
 const g=$('tkGps');
 if(trk.st==='idle')g.innerHTML='';
 else if(trk.gerr)g.innerHTML='<span class="dot"></span>'+t('tk_gps_no');
 else if(trk.acc==null)g.innerHTML='<span class="dot"></span>'+t('tk_gps_wait');
 else g.innerHTML='<span class="dot'+(trk.acc<=35?' on':'')+'"></span>'+t(trk.acc<=35?'tk_gps_ok':'tk_gps_weak').replace('{a}',trk.acc);
}
function renderTrack(){
 if(!isPro()){$('trackBox').innerHTML=lockCard();return}
 const idle=trk.st==='idle';
 let h='<section class="card"><h2>'+t('tk_title')+'</h2>';
 h+='<div class="btns" style="margin-top:0"><button class="b '+(trk.type==='walk'?'':'sec')+'" style="flex:1" onclick="setType(\'walk\')" '+(idle?'':'disabled')+'>'+t('tk_walk')+'</button><button class="b '+(trk.type==='run'?'':'sec')+'" style="flex:1" onclick="setType(\'run\')" '+(idle?'':'disabled')+'>'+t('tk_run')+'</button></div>';
 h+='<div class="hero"><div class="km" id="tkKm">0.00</div><div class="lbl">'+t('tk_km')+'</div></div>';
 h+='<div class="big3"><div><b id="tkTime">0:00</b><small>'+t('tk_time')+'</small></div><div><b id="tkPace">--</b><small>'+t('tk_pace')+'</small></div><div><b id="tkSpeed">0</b><small>'+t('tk_speed')+'</small></div><div><b id="tkKcal">0</b><small>'+t('tk_kcal')+'</small></div><div><b id="tkSteps">0</b><small>'+t('tk_steps')+'</small></div><div><b>'+(trk.type==='run'?'🏃':'🚶')+'</b><small>'+t(trk.type==='run'?'tk_run':'tk_walk').replace(/^\S+\s/,'')+'</small></div></div>';
 h+='<div class="gps" id="tkGps"></div><div class="btns">';
 if(idle)h+='<button class="b big grn" onclick="trkStart()">'+t('tk_start')+'</button>';
 else h+='<button class="b big sec" onclick="trkPause()">'+(trk.st==='pause'?t('tk_resume'):t('tk_pause'))+'</button><button class="b big red" onclick="trkStop()">'+t('tk_stop')+'</button>';
 h+='</div><p class="hint">'+t('tk_note')+'</p></section>';
 if(trk.done&&idle){const r=trk.done;h+='<section class="card"><h2>'+t('tk_last')+'</h2><div class="big3"><div><b>'+(r.dist/1000).toFixed(2)+'</b><small>'+t('tk_km')+'</small></div><div><b>'+fmtDur(r.dur)+'</b><small>'+t('tk_time')+'</small></div><div><b>'+r.kcal+'</b><small>'+t('tk_kcal')+'</small></div></div>'+routeSvg(r.pts)+'</section>'}
 // week
 const runs=getRuns(),wk=runs.filter(r=>r.id>Date.now()-7*864e5),wkm=wk.reduce((a,r)=>a+r.dist,0),wmin=Math.round(wk.reduce((a,r)=>a+r.dur,0)/60),pc=Math.min(100,Math.round(wmin/150*100));
 h+='<section class="card"><h2>'+t('tk_week')+'</h2><div class="big3"><div><b>'+(wkm/1000).toFixed(1)+'</b><small>'+t('tk_km')+'</small></div><div><b>'+wmin+'</b><small>'+t('tk_min')+'</small></div><div><b>'+wk.length+'</b><small>'+t('tk_sess')+'</small></div></div>';
 h+='<div class="brow"><span>'+t('tk_who')+'</span><b>'+pc+'%</b></div><div class="bar"><i style="width:'+pc+'%;background:linear-gradient(90deg,var(--acc),var(--main))"></i></div></section>';
 h+='<section class="card"><h2>'+t('tk_hist')+'</h2>';
 if(!runs.length)h+='<p class="hint">'+t('tk_empty')+'</p>';
 else{h+='<div style="overflow-x:auto"><table><thead><tr><th>'+t('h_date')+'</th><th></th><th>'+t('tk_km')+'</th><th>'+t('tk_time')+'</th><th>'+t('tk_kcal')+'</th><th></th></tr></thead><tbody>';
  runs.slice(0,30).forEach(r=>{h+='<tr><td>'+dtStr(r.id)+'</td><td>'+(r.type==='run'?'🏃':'🚶')+'</td><td><b>'+(r.dist/1000).toFixed(2)+'</b></td><td>'+fmtDur(r.dur)+'</td><td>'+r.kcal+'</td><td style="white-space:nowrap"><button class="b sec small" onclick="viewRun('+r.id+')">'+t('h_view')+'</button> <button class="b red small" onclick="delRun('+r.id+')">✕</button></td></tr>'});
  h+='</tbody></table></div>'}
 h+='</section>';
 $('trackBox').innerHTML=h;trkUi();
}
function viewRun(id){const r=getRuns().find(x=>x.id===id);if(r){trk.done=r;renderTrack();window.scrollTo({top:0,behavior:'smooth'})}}
function delRun(id){ask(t('tk_delc'),()=>{jset('bh_runs',getRuns().filter(x=>x.id!==id));if(trk.done&&trk.done.id===id)trk.done=null;renderTrack()})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&trk.st==='run'){trk.lock=null;keepAwake()}});
window.addEventListener('beforeunload',e=>{if(trk.st!=='idle'){e.preventDefault();e.returnValue=t('tk_leave')}});

/* ================= daily: water, BP, sugar ================= */
function waterGoal(){const h=getHist()[0];if(last)return last.r.cups;if(h)return calc(h.d).cups;return 8}
function addWater(n){const w=jget('bh_water',{}),k=dayKey();w[k]=Math.max(0,(w[k]||0)+n);
 const keys=Object.keys(w).sort();while(keys.length>60)delete w[keys.shift()];
 jset('bh_water',w);renderDaily();if(n>0&&w[k]===waterGoal())toast(t('dw_done'))}
function bpCat(s,d){if(s>180||d>120)return['bp_c','bad'];if(s<90||d<60)return['bp_l','warn'];if(s>=140||d>=90)return['bp_2','bad'];if(s>=130||d>=80)return['bp_1','warn'];if(s>=120)return['bp_e','warn'];return['bp_n','good']}
function bsCat(v,ty){if(v<70)return['bs_low','bad'];if(ty==='f')return v<100?['bs_n','good']:v<126?['bs_pre','warn']:['bs_hi','bad'];if(ty==='pp')return v<140?['bs_n','good']:v<200?['bs_pre','warn']:['bs_hi','bad'];return v<140?['bs_n','good']:v<200?['bs_pre','warn']:['bs_hi','bad']}
function addBp(){
 const s=num('bpS'),d=num('bpD'),p=num('bpP');
 if(!s||!d||s<60||s>260||d<30||d>160||s<=d||(p!=null&&(p<30||p>220))){toast(t('bp_err'));return}
 const a=jget('bh_bp',[]);a.unshift({id:Date.now(),s:s,d:d,p:p});jset('bh_bp',a.slice(0,300));
 const c=bpCat(s,d);toast(t('dl_saved')+' — '+(c[0]==='bp_c'?t('bp_2'):t(c[0])));renderDaily();
}
function addBs(){
 const v=num('bsV'),ty=$('bsT').value;
 if(!v||v<20||v>600){toast(t('bs_err'));return}
 const a=jget('bh_bs',[]);a.unshift({id:Date.now(),v:v,ty:ty});jset('bh_bs',a.slice(0,300));
 toast(t('dl_saved')+' — '+t(bsCat(v,ty)[0]).split(':')[0]);renderDaily();
}
function delLog(key,id){ask(t('dl_delc'),()=>{jset(key,jget(key,[]).filter(x=>x.id!==id));renderDaily()})}
function renderDaily(){
 if(!isPro()){$('dailyBox').innerHTML=lockCard();return}
 const w=jget('bh_water',{}),today=w[dayKey()]||0,goal=waterGoal(),pc=Math.min(100,Math.round(today/goal*100));
 let h='<section class="card"><h2>'+t('dw_title')+'</h2><div class="water"><button class="b sec" onclick="addWater(-1)" aria-label="-">−</button><div class="cnt">'+today+'<span style="font-size:18px;color:var(--mute)"> / '+goal+'</span></div><button class="b" onclick="addWater(1)" aria-label="+">+</button></div>';
 h+='<div class="bar"><i style="width:'+pc+'%;background:linear-gradient(90deg,#4fc3f7,var(--main))"></i></div><p class="hint" style="text-align:center">'+t('dw_goal').replace('{g}',goal)+' · '+t('cups')+'</p>';
 h+='<div class="hint" style="margin-top:6px">'+t('dw_week')+'</div><div class="wk">';
 const mx=Math.max(goal,1);
 for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),v=w[dayKey(d)]||0;h+='<div><span>'+v+'</span><i style="height:'+Math.min(100,v/mx*100)+'%;'+(v>=goal?'':'opacity:.55')+'"></i><span>'+d.toLocaleDateString(lang==='ar'?'ar-JO':'en-GB',{weekday:'short'})+'</span></div>'}
 h+='</div></section>';
 // BP
 const bp=jget('bh_bp',[]);
 h+='<section class="card"><h2>'+t('bp_title')+'</h2><div class="grid"><div><label for="bpS">'+t('bp_sys')+'</label><input id="bpS" type="number" inputmode="numeric" placeholder="120"></div><div><label for="bpD">'+t('bp_dia')+'</label><input id="bpD" type="number" inputmode="numeric" placeholder="80"></div><div><label for="bpP">'+t('bp_pulse')+'</label><input id="bpP" type="number" inputmode="numeric" placeholder="72"></div></div>';
 h+='<div class="btns"><button class="b" onclick="addBp()">+ '+t('add')+'</button></div><p class="hint">'+t('bp_tip')+'</p>';
 if(bp[0]){const c=bpCat(bp[0].s,bp[0].d);if(c[0]==='bp_c')h+='<div class="warnbox">🚨 '+t('bp_c')+'</div>'}
 if(bp.length>=2)h+=lineChart(bp.slice(0,10).reverse().map(x=>x.s),'#d64545');
 h+=logTable(bp,'bh_bp',x=>'<b>'+x.s+'/'+x.d+'</b>'+(x.p?' <small>♥'+x.p+'</small>':''),x=>bpCat(x.s,x.d));
 h+='</section>';
 // sugar
 const bs=jget('bh_bs',[]);
 h+='<section class="card"><h2>'+t('bs_title')+'</h2><div class="grid"><div><label for="bsV">'+t('bs_val')+'</label><input id="bsV" type="number" inputmode="numeric" placeholder="95"></div><div><label for="bsT">'+t('bs_type')+'</label><select id="bsT"><option value="f">'+t('bs_f')+'</option><option value="pp">'+t('bs_pp')+'</option><option value="r">'+t('bs_r')+'</option></select></div></div>';
 h+='<div class="btns"><button class="b" onclick="addBs()">+ '+t('add')+'</button></div>';
 if(bs[0]&&bs[0].v<70)h+='<div class="warnbox">⚠️ '+t('bs_low')+'</div>';
 h+=logTable(bs,'bh_bs',x=>'<b>'+x.v+'</b> <small>'+t('bs_'+x.ty)+'</small>',x=>bsCat(x.v,x.ty));
 h+='<p class="disc">'+t('dl_note')+'</p></section>';
 $('dailyBox').innerHTML=h;
}
function logTable(a,key,val,cat){
 if(!a.length)return '<p class="hint">'+t('dl_none')+'</p>';
 let h='<div class="hint">'+t('dl_last')+'</div><table><tbody>';
 a.slice(0,10).forEach(x=>{const c=cat(x);h+='<tr><td>'+dtStr(x.id)+'</td><td>'+val(x)+'</td><td><span class="tag '+c[1]+'">'+t(c[0]).split(':')[0]+'</span></td><td><button class="b red small" onclick="delLog(\''+key+'\','+x.id+')">✕</button></td></tr>'});
 return h+'</tbody></table>';
}

/* ================= backup / restore ================= */
function exportData(){
 if(!isPro()){showTab('sub');return}
 const data=JSON.stringify({app:'sehati',ver:APP_VER,exported:new Date().toISOString(),hist:getHist(),runs:getRuns(),bp:jget('bh_bp',[]),bs:jget('bh_bs',[]),water:jget('bh_water',{})});
 if(window.AndroidApp){AndroidApp.saveFile('sehati-backup-'+dayKey()+'.json',data);return}
 const blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='sehati-backup-'+dayKey()+'.json';
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function mergeById(key,arr,idk){if(!Array.isArray(arr))return 0;const cur=jget(key,[]),seen={};cur.forEach(x=>seen[x[idk]]=1);let n=0;arr.forEach(x=>{if(x&&x[idk]!=null&&!seen[x[idk]]){cur.push(x);n++}});cur.sort((a,b)=>a[idk]<b[idk]?1:-1);jset(key,cur);return n}
function importData(inp){
 const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{
  try{
   const j=JSON.parse(rd.result);const hist=Array.isArray(j)?j:j.hist;let n=0;
   if(Array.isArray(hist)){const cur=getHist(),seen={};cur.forEach(x=>seen[x.date]=1);
    hist.filter(x=>x&&x.date&&x.d&&typeof x.d.weight==='number'&&typeof x.d.height==='number').forEach(x=>{if(!seen[x.date]){const r=calc(Object.assign({cond:'none',fast:'none',act:1.375,goal:'health',age:30,sex:'m'},x.d));cur.push({date:x.date,d:x.d,bmi:r1(r.bmi),score:r.score});n++}});setHist(cur)}
   if(!Array.isArray(j)){n+=mergeById('bh_runs',j.runs,'id');n+=mergeById('bh_bp',j.bp,'id');n+=mergeById('bh_bs',j.bs,'id');
    if(j.water&&typeof j.water==='object'){const w=jget('bh_water',{});for(const k in j.water)if(/^\d{4}-\d\d-\d\d$/.test(k))w[k]=Math.max(w[k]||0,+j.water[k]||0);jset('bh_water',w)}}
   renderAll();toast(t('r_ok').replace('{n}',n));
  }catch(e){toast(t('r_bad'))}
  inp.value='';
 };
 rd.readAsText(f);
}

/* ================= export & share ================= */
function doPdf(){
 if(!isPro()){showTab('sub');return}
 const old=document.title;document.title=(last&&last.d.name?last.d.name+' - ':'')+t('rep_title');
 if(window.AndroidApp){AndroidApp.print(document.title);setTimeout(()=>{document.title=old},500);return}
 window.print();setTimeout(()=>{document.title=old},500);
}
function shareRep(){
 if(!last)return;const d=last.d,r=last.r;
 let s=t('sh_head')+(d.name?' — '+d.name:'')+' ('+dateStr(last.date)+')\n';
 s+=t('score')+': '+r.score+'/100 ('+scoreInfo(r.score).l+')\n'+t('m_bmi')+': '+r1(r.bmi)+' — '+t('bmi_'+r.bmiCat)+'\n';
 if(r.bf!==null)s+=t('m_bf')+': '+r1(r.bf)+'%\n';
 if(r.whtr!==null)s+=t('m_whtr')+': '+r.whtr.toFixed(2)+'\n';
 s+=t('target')+': '+r.kcal+' '+t('kcal')+' · '+t('protein')+' '+r.protein+t('g')+'\n'+t('m_water')+': '+r1(r.water)+' '+t('l')+'\n\n'+t('sh_from');
 if(window.AndroidApp)AndroidApp.share(s);
 else if(navigator.share)navigator.share({title:t('sh_head'),text:s}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast(t('copied')),()=>{});
}

applyTheme();trialStart();loadDraft();sexChanged();applyLang();showTab(tab);
document.querySelectorAll('#formCard input,#formCard select').forEach(e=>{e.addEventListener('change',saveDraft);e.addEventListener('input',()=>e.classList.remove('bad'))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('#formCard'))run()});
showDisc(false);initBilling();
setInterval(renderBanner,36e5);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
