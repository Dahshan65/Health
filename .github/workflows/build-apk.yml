name: Build Sehati APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p apk/app/src/main/java/com/dahshansoft/sehati apk/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png apk/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "sdk.dir=$ANDROID_HOME" > apk/local.properties
          echo "Android SDK: $ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

          cat > apk/settings.gradle <<'EOF'
          rootProject.name = "Sehati"
          include ':app'
          EOF

          cat > apk/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > apk/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.dahshansoft.sehati'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dahshansoft.sehati"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF

          cat > apk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:label="صحتي"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > apk/app/src/main/java/com/dahshansoft/sehati/MainActivity.java <<'EOF'
          package com.dahshansoft.sehati;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              static final String HOME = "https://dahshan65.github.io/Health/";
              static final String HOST = "dahshan65.github.io";
              WebView web;
              ValueCallback<Uri[]> fileCb;
              GeolocationPermissions.Callback geoCb;
              String geoOrigin;
              String pendingSave;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(0xFF0A74C4);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.addJavascriptInterface(new Bridge(), "AndroidApp");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              cb.invoke(origin, true, false);
                          } else {
                              geoOrigin = origin;
                              geoCb = cb;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try { startActivityForResult(i, 2); } catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  if (state != null) web.restoreState(state); else web.loadUrl(HOME);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  if (code == 1 && geoCb != null) {
                      boolean ok = false;
                      for (int r : res) if (r == PackageManager.PERMISSION_GRANTED) ok = true;
                      geoCb.invoke(geoOrigin, ok, false);
                      geoCb = null;
                  }
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  if (code == 2) {
                      if (fileCb != null) {
                          Uri u = (result == RESULT_OK && data != null) ? data.getData() : null;
                          fileCb.onReceiveValue(u != null ? new Uri[]{u} : null);
                          fileCb = null;
                      }
                  } else if (code == 3) {
                      if (result == RESULT_OK && data != null && data.getData() != null && pendingSave != null) {
                          try (OutputStream o = getContentResolver().openOutputStream(data.getData())) {
                              o.write(pendingSave.getBytes(StandardCharsets.UTF_8));
                              Toast.makeText(this, "✓", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "Error", Toast.LENGTH_SHORT).show();
                          }
                      }
                      pendingSave = null;
                  } else {
                      super.onActivityResult(code, result, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              class Bridge {
                  @JavascriptInterface
                  public void saveFile(final String name, final String content) {
                      runOnUiThread(() -> {
                          pendingSave = content;
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("application/json");
                          i.putExtra(Intent.EXTRA_TITLE, name);
                          try { startActivityForResult(i, 3); } catch (Exception e) { pendingSave = null; }
                      });
                  }

                  @JavascriptInterface
                  public void share(final String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, null));
                      });
                  }

                  @JavascriptInterface
                  public void print(final String title) {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          pm.print(title, web.createPrintDocumentAdapter(title), new PrintAttributes.Builder().build());
                      });
                  }

                  @JavascriptInterface
                  public void keepScreen(final boolean on) {
                      runOnUiThread(() -> {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd apk
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon --stacktrace --refresh-dependencies && break
            echo "Build attempt $i failed, retrying..."; sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Sehati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sehati-APK
          path: Sehati.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v3-${{ github.run_number }}
          name: صحتي APK 3.0 (${{ github.run_number }})
          files: Sehati.apk
