name: Build Sehati AAB for Google Play

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aab.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check signing key
        run: |
          mkdir -p twa/app
          echo "$KEYSTORE_BASE64" | base64 -d -i > twa/app/upload.keystore
          echo "Keystore file size: $(stat -c%s twa/app/upload.keystore) bytes (expected about 2724)"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD} | KEY_PASSWORD length: ${#KEY_PASSWORD} | KEY_ALIAS length: ${#KEY_ALIAS} (expected 12, 12, 12)"
          echo "----- Aliases inside the keystore -----"
          keytool -list -keystore twa/app/upload.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 | tail -n +1
          echo "----- Checking the alias -----"
          keytool -list -v -keystore twa/app/upload.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/k.txt 2>&1 || { cat /tmp/k.txt; exit 1; }
          grep -E "Alias name|SHA256" /tmp/k.txt

      - name: Create Android TWA project
        run: |
          mkdir -p twa/app/src/main/java/com/dahshan/health twa/app/src/main/res/values twa/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "sdk.dir=$ANDROID_HOME" > twa/local.properties

          cat > twa/settings.gradle <<'EOF'
          rootProject.name = "Sehati"
          include ':app'
          EOF

          cat > twa/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > twa/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > twa/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.dahshan.health'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dahshan.health"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "3.0"
              }
              signingConfigs {
                  release {
                      storeFile file('upload.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
          }
          EOF

          cat > twa/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">صحتي</string>
              <string name="asset_statements">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://dahshan65.github.io\"}}]</string>
          </resources>
          EOF

          cat > twa/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0A74C4</color>
              <color name="navigationColor">#FFFFFF</color>
          </resources>
          EOF

          cat > twa/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:label="@string/app_name"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://dahshan65.github.io/Health/" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/colorPrimary" />
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/navigationColor" />
                      <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="customtabs" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="dahshan65.github.io" android:pathPrefix="/Health" />
                      </intent-filter>
                  </activity>

                  <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity"
                      android:configChanges="orientation|screenSize" />

                  <activity
                      android:name="com.google.androidbrowserhelper.locationdelegation.PermissionRequestActivity"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:exported="false" />

                  <service
                      android:name=".DelegationService"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > twa/app/src/main/java/com/dahshan/health/DelegationService.java <<'EOF'
          package com.dahshan.health;

          import com.google.androidbrowserhelper.locationdelegation.LocationDelegationExtraCommandHandler;

          public class DelegationService extends com.google.androidbrowserhelper.trusted.DelegationService {
              @Override
              public void onCreate() {
                  super.onCreate();
                  registerExtraCommandHandler(new LocationDelegationExtraCommandHandler());
              }
          }
          EOF

      - name: Build signed AAB
        run: |
          cd twa
          for i in 1 2 3; do
            gradle bundleRelease --no-daemon --stacktrace && break
            echo "Build attempt $i failed, retrying..."; sleep 20
          done
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../Sehati-3.0.aab
          rm -f app/upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Sehati-AAB
          path: Sehati-3.0.aab

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-v3-${{ github.run_number }}
          name: صحتي AAB 3.0 لـ Google Play (${{ github.run_number }})
          files: Sehati-3.0.aab
